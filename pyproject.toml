[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "uyam"
version = "0.1.0"
description = "Reddit data-collection pipeline for Taglish sarcasm detection research"
requires-python = ">=3.11"
dependencies = [
    "praw>=8.0",
    "pydantic>=2.0",
    "typer>=0.12",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "requests>=2.31",
    "streamlit>=1.28",
    "pandas>=2.0",
    "patchright>=1.52",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-PyYAML",
    "types-requests",
]

browser = [
    "patchright>=1.52",
]

annotate = [
    "ollama>=0.5.1",             # chat + format=json-schema + think kwarg
    "fasttext-predict>=0.9.2",   # prebuilt win_amd64 wheel; plain 'fasttext' needs MSVC
    "transformers>=4.44",
    "sentencepiece>=0.2",        # XLM-R tokenizer backend (cardiffnlp sentiment model)
    "torch>=2.3",                # CUDA build: pip install torch --index-url https://download.pytorch.org/whl/cu124
    "statsmodels>=0.14",         # fleiss_kappa
    "scikit-learn>=1.4",         # cohen_kappa_score
    "krippendorff>=0.6",
    "pyarrow>=16",               # parquet export
]

[project.scripts]
uyam = "uyam.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/uyam"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
