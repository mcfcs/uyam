[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "uyam"
version = "0.1.0"
description = "Reddit data-collection pipeline for Taglish sarcasm detection research"
requires-python = ">=3.11"
dependencies = [
    "praw>=8.0",
    "pydantic>=2.0",
    "typer>=0.12",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "requests>=2.31",
    "streamlit>=1.28",
    "pandas>=2.0",
    "patchright>=1.52",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-PyYAML",
    "types-requests",
]

browser = [
    "patchright>=1.52",
]

[project.scripts]
uyam = "uyam.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/uyam"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
