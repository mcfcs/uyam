# dataset-v3: equal-size re-annotation (adviser's action item, 2026-11).
#
# Use with --config-path config/annotation-v3.yaml. It works on its OWN
# database, a fork of annotation.sqlite3 made once with:
#   uyam annotate fork --to data/db/annotation-v3.sqlite3 --keep qwen3 --keep sealion \
#     --extend 2026-06:1600 --extend 2026-07:1600 --extend 2026-10:1600 --extend 2026-11:1200
# The fork keeps the qwen3 and SEA-LION votes, the context snapshots and the
# gold labels, and pins the target set (the 15,000 v2 items + the extension).
# dataset-v1/v2 and annotation.sqlite3 are never touched.
#
# Lineup: three ~8-9B models from three families, two of them Filipino-tuned,
# all q4 and all on this laptop's 8 GB GPU. No remote box: 100.102.10.69 is
# Gio's gaming PC (RULES §6). Ask Gio before any run.

db_path: data/db/annotation-v3.sqlite3
data_dir: data

# Same prompt contract as v2, so the kept qwen3 / SEA-LION votes are valid.
prompt_version: sarc-v2

endpoints:
  local: http://127.0.0.1:11434

annotators:
  - key: qwen3
    model: "qwen3:8b"                                     # 8B, Qwen3 family, ~5.2 GB q4
    endpoint: local
    think: false
  - key: sealion
    model: "aisingapore/Gemma-SEA-LION-v3-9B-IT:q4_k_m"   # 9B, Gemma 2 family, Filipino-tuned
    endpoint: local
    merge_system_prompt: true
  - key: llamasealion
    model: "aisingapore/Llama-SEA-LION-v3-8B-IT:q4_k_m"   # 8B, Llama 3.1 family, Filipino-tuned
    endpoint: local

# Majority vote, adviser's item: three binary votes always have a majority, and
# a 1-1-1 tie on a 3-class label takes the most confident vote. Nothing is
# escalated, so there is no adjudicator (the v2 one was a 32B model).
aggregation:
  sarcasm_rule: majority
  tie_break: confidence

options:
  temperature: 0.0
  seed: 7
  num_ctx: 8192
  num_predict: 700
  keep_alive: 30m
  timeout_seconds: 300
  max_retries: 3

context:
  max_parent_chain: 6
  max_replies: 3
  max_context_chars: 6000

candidate_filters:
  min_chars: 12
  min_tokens: 3
  exclude_authors: [AutoModerator]
  exclude_distinguished_moderator: true
  include_link_posts: false
  exclude_phatic: true
  phatic_max_tokens: 10
  phatic_max_leftover: 2

lid:
  model_path: data/models/lid.176.bin
  mono_threshold: 0.9

tx_sentiment:
  model: cardiffnlp/twitter-xlm-roberta-base-sentiment
  device: auto
  batch_size: 32

review:
  gold_size: 300
  adjudicator_confidence_floor: 0.6
  gold_split_oversample: 2.0
  gold_sarcastic_oversample: 2.0

# 15,000 v2 items + 6,000 extension items (Jun, Jul, Oct, Nov 1-10).
pipeline:
  target_items: 21000

export:
  out_dir: data/annotated
