data_dir: data

subreddits:
  - Philippines
  - CasualPH
  - OffMyChestPH

collection:
  listing: new
  limit_per_subreddit: 100
  sort: null
  time_filter: all

comments:
  enabled: true
  max_comments_per_submission: 100
  max_depth: null          # null = no limit; set e.g. 5 to cap depth
  include_deleted: false
  sort: confidence
  replace_more_limit: 32  # number of MoreComments objects PRAW expands per submission
                           # null = expand all (many API calls, slow for large threads)
                           # 0   = remove MoreComments without expanding (loses nested replies)

search:
  enabled: false
  query: null
  sort: relevance
  time_filter: all

oversampling:
  enabled: false
  keywords: []
  # Example oversampling keywords for Taglish sarcasm candidates:
  # keywords:
  #   - "edi wow"
  #   - "sana all"
  #   - "wow ha"
  #   - "galing"
  #   - "ayos"
  #   - "nice"
  #   - "talino"
  #   - "salamat ah"
  #   - "buti naman"
  # Records collected via oversampling keywords are tagged:
  #   sampling_strategy: "keyword_oversampled"
  #   matched_query_or_keyword: "<the keyword>"
  # This tag is CRITICAL for thesis methodology — do not mix oversampled
  # records with natural samples without accounting for this in your analysis.

retry:
  max_attempts: 5
  max_delay_seconds: 60

public:
  # Legacy JSON-endpoint settings (kept for the in-process PublicJsonRedditSource).
  # Live CLI collection uses --source shreddit (or public as an alias) instead.
  min_interval_seconds: 6
  timeout_seconds: 30

shreddit:
  # Headful Chrome scrape of www.reddit.com (Shreddit custom elements).
  # Requires proxies.txt. Headful + system Chrome is the anti-bot baseline.
  headless: false
  timeout_seconds: 45
  min_interval_seconds: 1.5   # pause between navigations
  max_scrolls: 40             # listing infinite-scroll rounds
  more_comments_clicks: 250   # "more comments" expansions per post (all-replies mode uses max(this, 400))
  scroll_wait_ms: 1500
  expand_wait_ms: 1200
  use_system_chrome: true     # channel="chrome"; falls back to bundled Chromium
  captcha_wait_seconds: 300   # pause so you can solve the Chrome captcha; 0 = don't wait
