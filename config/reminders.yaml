# To-dos for Gio, shown in the Streamlit "Reminders" tab.
#
# Agents: when you leave Gio a step to do (a real run, a review, thesis text),
# append it here with a new unique `id` — never reuse or rename an id, the
# done-state in data/reminders.json is keyed by it. Mirror it in HANDOFF.md.
#
# Fields: id, section, title, details (markdown), command (optional, shown as a
# copyable block), check (optional built-in detector that shows a hint — it
# never ticks the box for you):
#   db_backup | proxies_file | archive_runs | shreddit_recent | phatic_selected
#   low_conf_queue | gold_progress | export_v2

reminders:
  - id: backup-annotation-db-2026-11
    section: Before any real run
    title: Back up the annotation database
    details: >
      RULES §5.3: copy `data/db/annotation.sqlite3` before re-indexing or
      re-selecting. Close the Streamlit app or stop annotation jobs first so
      the copy is consistent.
    command: copy data\db\annotation.sqlite3 data\db\annotation-2026-11-10.bak.sqlite3
    check: db_backup

  - id: archive-backfill-jun-nov
    section: Data collection
    title: Run the archive backfill (2026-06-01 → 2026-11-10)
    details: >
      Done 2026-11-19: all three subreddits are complete from Jun 1 to Nov 10
      (corpus 588,507 records). Re-running is safe because dedup skips stored
      posts. The keyword searches proved redundant and were stopped.
    command: uyam collect --source archive --since 2026-06-01 --until 2026-11-10 --per-day 40
    check: archive_runs

  - id: proxies-new-provider-2026-11
    section: Data collection
    title: Load the new provider's proxies (Wolves plan expired)
    details: >
      proxies.txt still held only the 5,000 wolveproxy.com proxies (unchanged
      since 2026-08-15), so Shreddit runs were going through dead proxies — the
      last real run (2026-09-05) logged 1,267 failed page loads. Proxies tab →
      paste or upload the new provider's list → "Test the new list first" →
      Replace the whole list (a backup is kept). The archive backfill does not
      need proxies.
    check: proxies_file

  - id: shreddit-latest-days-nov
    section: Data collection
    title: Fill the latest days with Shreddit (archive lags ~2 days)
    details: >
      Ran 2026-11-11 (walk only): Nov 8–10 is collected for all three
      subreddits, so tick this once you've glanced at the Detected line. Use
      the same command with a later --since for top-ups, or as a fallback if
      the archive is down. Needs Chrome + proxies.txt; solve any captcha in
      the Chrome window.
    command: uyam collect --source shreddit --since 2026-11-08 --per-day 40
    check: shreddit_recent

  - id: shreddit-keyword-searches-2026-11
    section: Data collection
    title: "Not needed any more: Shreddit keyword-oversampling searches"
    details: >
      Superseded 2026-11-19. The archive collected every post from Jun 1 to
      Nov 10, so any keyword search only re-finds posts already stored (the
      archive's own searches returned 107 hits, all duplicates). You can just
      tick this off. Oversampling is now an annotation choice; see the
      "Decide whether to annotate the 1,148 sarcasm-marker items" reminder.

  - id: retag-shreddit-trial-2026-11-10
    section: Data collection
    title: "Done: mis-tagged Shreddit trial rows re-tagged natural"
    details: >
      Done 2026-11-19 with your OK (`uyam retag-calendar-walk`): 57 posts and
      543 comments from the 2026-11-10 trial now say `natural`. The rewritten
      files were backed up under data/raw-backup-*/ and the three manifests
      note the correction. The corpus has no keyword_oversampled records
      left. Tick this off.

  - id: decide-marker-oversampling-2026-11
    section: Annotation
    title: Decide whether to annotate the 1,148 sarcasm-marker items
    details: >
      Collection is complete (every post Jun 1 → Nov 10), so searching Reddit
      by keyword adds nothing. Oversampling can only mean choosing extra
      annotation targets: the 1,148 unlabeled items containing a marker
      ("sana all" looks strongest: 8 of 15 labeled are sarcastic). They'd be
      tagged keyword_oversampled and kept out of natural metrics. That's about
      8% of the original annotation effort. If not, the thesis says
      oversampling wasn't needed at collection. See UYAM_LATEST.md §5.

  - id: reindex-reselect-phatic
    section: Annotation
    title: Re-index the corpus and re-run candidate selection
    details: >
      Done 2026-11-19 after a DB backup: 588,507 records indexed, 512,471
      eligible, 1,417 unlabeled phatic items excluded. The 120 already-labeled
      phatic items keep their labels and are only flagged (you chose frozen
      labels), so nothing went to a review queue. Labels, contexts and gold
      labels were checked against the backup: 0 changes. Tick this off; re-run
      only after new data is collected.
    command: uyam annotate index && uyam annotate select
    check: phatic_selected

  - id: review-phatic-low-confidence
    section: Annotation
    title: "Not needed any more: low-confidence phatic review"
    details: >
      Superseded 2026-11-19. You chose to freeze the 15,000 labels, so the
      phatic items are flagged in the export instead of being queued for you
      (none of the 120 is labeled sarcastic). The low_confidence queue is
      empty. Tick this off.
    check: low_conf_queue

  - id: gold-subset-300
    section: Annotation
    title: Finish the gold subset (300 items)
    details: >
      Fastest: the labeling-only site at http://100.71.83.125:8502
      (run-label-app.bat), or the main app's "Annotation Review" tab. Needed for the human-vs-ensemble
      Cohen's κ (leische H1/U3). Redrawn 2026-11-22 with sarcastic and split
      items weighted ×2: 62 of the 300 are ensemble-sarcastic. Your 31 labels
      are kept. Label each item blind first, using docs/GUIDELINE.md v1.1:
      tick the sarcastic sentence(s), or "unsure". If an item is sarcastic
      only because of a wry hugot, self-pity or playful-praise pose (D1),
      write D1 in notes. To see Claude's suggestion while labeling (a second
      judgement), switch on "Show Claude's suggestion before I label". Those
      items are recorded as Claude-informed. Otherwise you can reveal it after
      saving and revise. Your first pass is kept and is what κ uses.
      Don't tick "Reveal model votes" before saving.
    check: gold_progress

  - id: guideline-decisions-d1-d5
    section: Annotation
    title: Settle the remaining guideline decisions D2, D3, D5 (GUIDELINE §7)
    details: >
      D1 is decided (2026-11-22, broad reading: hugot, self-pity and playful
      praise can count, tagged D1) and so is D4. Still open, but none of
      them blocks labeling: D2 (retelling your own earlier sarcastic line),
      D3 (whether a 50/50 call defaults to "no"; the draft says yes), and D5
      (a blind second pass over the first 31, at least two weeks later, for
      intra-annotator κ). The assist agents also flagged uncovered cases: a
      dismissive "good luck", leading rhetorical questions, mocking "daw"
      next to a rebuttal, scare quotes, and parody quotes. These are listed
      in HANDOFF.md.

  - id: export-dataset-v2
    section: Handoff to leische
    title: Export dataset v2 (leische is waiting for it)
    details: >
      leische's LEISCHE_LATEST says it will re-run the temporal conditions
      "once uyam exports", so waiting for leische to be ready leaves both
      repos waiting on each other. The export is safe now: it writes new v2
      files and never touches v1, and leische won't train on v2 until its own
      code changes are done (results/v2/, selectable version, masking). A
      trial export on 2026-11-19 matched v1 exactly (same 15,000 items, 0
      label changes, κ shipped vs majority 0.545, 48 h coverage 46.5% vs
      ~35%). Gold labels can follow later as a re-export. Then send the
      bundle (next reminder) and paste docs/briefs/LEISCHE_BRIEF.md into a
      leische chat.
    command: uyam annotate export --version v2
    check: export_v2

  - id: send-v2-to-leische
    section: Handoff to leische
    title: Send the v2 bundle to the leische machine
    details: >
      The data never goes through GitHub (uyam is public and data/ is
      gitignored). Either open http://100.71.83.125:8501 from the leische
      device → Annotation tab → Download bundle (.zip), or send it with
      Taildrop from this PC (`tailscale file cp
      data\annotated\uyam-dataset-v2.zip <leische-device>:`, then
      `tailscale file get .` on the leische device). Then unzip and run
      `sha256sum -c SHA256SUMS.txt`. The leische chat brief has the rest.

  - id: thesis-arctic-shift-method
    section: Thesis manuscript
    title: State the Arctic Shift archive in methodology + ethics
    details: >
      Chapter III: historical posts come from a third-party Reddit archive
      (Arctic Shift); Aug–Sep core scraped live. Archive scores are
      ingest-time snapshots, so score is not compared across sources.
      Authors hashed with the same HMAC key before storage.

  - id: ethics-collection-method-2026-11
    section: Thesis manuscript
    title: Settle the data-collection ethics with your adviser
    details: >
      None of the data came through Reddit's official API: the v1 core was
      scraped (logged-out pages, rotating proxies), and v2 history comes from
      the Arctic Shift archive. Reddit's User Agreement (1 Jul 2026)
      prohibits scraping without prior written consent. The thesis should
      describe the real method, drop the "public API" reason in Scope ¶1,
      disclose proxy rotation, and state a deletion policy for archived
      content. See UYAM_LATEST.md §3.1. Every one of the 15,000 labeled items
      came from the live Shreddit scrape, so "a public archive was used" is
      not true for them and can't replace the disclosure. If the API
      application is approved, the labeled ids can be re-fetched through it
      (provenance check, deletions honoured). That is a mitigation to report,
      not a substitute.

  - id: thesis-window-and-phatic
    section: Thesis manuscript
    title: Update the collection window and preprocessing filters
    details: >
      Real span after the backfill (from dataset_card `collection_window`),
      and add the `phatic` exclusion (birthday / thanks / congrats-only text)
      to the preprocessing list with its count from the card.

  - id: thesis-guideline-and-assist-2026-11
    section: Thesis manuscript
    title: Describe the written guideline and the blind-first Claude assist
    details: >
      Chapter III (human subset): the gold labels follow a written guideline
      (docs/GUIDELINE.md), and the first 31 items predate it. The 269 were
      redrawn stratified by sarcasm × language × split vote × length band.
      You label each item blind first, then may view a Claude suggestion
      and revise, and κ uses the blind first pass. Ethics: the item text was
      processed by a third-party model (Claude). Also fix "when all three
      agreed, that label was accepted": 341 unanimous-sarcasm rows were still
      adjudicated because another label split. See UYAM_LATEST.md §6.1–6.2.

  - id: pilot-nimble-annotator-2026-11
    section: Optional
    title: Pilot nimble (adviser's suggestion) as an evaluation-only annotator
    details: >
      nimble:9b (Bespoke Labs, fine-tuned Qwen3.5-9B, ~9.4 GB, Apache 2.0) is a
      fast classification model with no reasoning step and no stated Tagalog
      support. It won't fit the 8 GB local GPU, so run it on the 24 GB box:
      `ollama pull nimble:9b` there first. The tooling is ready: the command
      below runs it on all 300 gold items, and its votes go to a separate
      table that can never change the dataset. `uyam annotate eval-report`
      compares it with your gold labels against the three current
      annotators; the report is meaningful once about 150 items are labeled.
      Don't add it to the voting ensemble for v2; leische asked that the
      labels stay unchanged.
    command: uyam annotate evaluate --model nimble && uyam annotate eval-report --out data/eval-report.md

  - id: optional-annotate-new-items
    section: Optional
    title: Annotate new Jun–Nov items (raise the target above 12,000)
    details: >
      Only if you want more labels, not just more temporal context. Raise
      `pipeline.target_items` in config/annotation.yaml, then Start ALL.
    command: uyam annotate pipeline

  - id: adviser-meeting-2026-11-25
    section: Adviser items (meeting Wed 2026-11-25)
    title: Prepare the adviser meeting (questions to settle)
    details: >
      Status of every adviser item is in UYAM_LATEST.md §10. Questions to bring:
      (1) Tell him the second annotator doesn't fit the time. Is a single
      annotator plus an intra-annotator check (D5) acceptable as a stated
      limitation?
      (2) Equal-size re-annotation: is replacing only gemma3:27b with a ~9B
      model (one new model, majority vote, no adjudicator) acceptable? Does it
      need to finish before the final defense, or can it be future work?
      (3) Language naming: keep three profiles renamed English / Filipino /
      Filipino–English code-switched? The Chapter 4 by-language result needs
      them kept separate. (4) Is the archive (Arctic Shift) also covered by
      "API approval before collection continues"? Collection is complete and
      frozen either way.

  - id: second-annotator-2026-11
    section: Adviser items (meeting Wed 2026-11-25)
    title: "Not now: second human annotator (doesn't fit the time; Gio, 2026-11-22)"
    details: >
      Deferred. Tell the adviser on Wednesday, and state it as a limitation:
      a single annotator, so no inter-annotator κ. The partial substitute is
      D5, a blind re-label of the first 31 items at least two weeks later,
      which gives an intra-annotator κ. If it becomes possible later: a
      native Filipino/English speaker labels the gold items blind (no votes,
      no Claude assist), and uyam needs a per-annotator review table first
      (an agent can build it). Tick this off once you've told the adviser.

  - id: decide-equal-size-reannotation-2026-11
    section: Adviser items (meeting Wed 2026-11-25)
    title: "dataset-v3 re-annotation: running since 2026-11-22 02:50 (~33 h; watch it in the Annotation tab)"
    details: >
      Decided 2026-11-22: re-annotate with equal-size models and add ~6,000
      items from Jun, Jul, Oct and Nov 1-10. The v3 database is already forked
      (data/db/annotation-v3.sqlite3, 21,000 pinned targets). The lineup is
      qwen3:8b + Gemma-SEA-LION-v3-9B + Llama-SEA-LION-v3-8B, all on this
      laptop. The 100-item pilot of the new model passed: 0 failures, 2.3 s
      per item, sarcasm agreement 86-90% with the other annotators.
      Remaining work: Llama-SEA-LION on the other 20,900 (about 13.5 h), then
      qwen3 and SEA-LION on the 6,000 new items (about 4.7 h + 9.5 h), plus
      LID and sentiment for the new items (minutes). The laptop must stay on,
      plugged in and awake, and games on the laptop GPU will slow it. It is
      safe to stop and resume, and the gaming PC is never used. When it ends:
      `uyam annotate aggregate --config-path config/annotation-v3.yaml`, then
      an agent checks it and exports v3.
    command: uyam annotate pipeline --config-path config/annotation-v3.yaml

  - id: reddit-api-application-2026-11
    section: Adviser items (meeting Wed 2026-11-25)
    title: "Reddit API access (pending): collection stays frozen until approved"
    details: >
      Adviser: the headed-browser scraper is not API-compliant, and approval is
      required before data collection continues. uyam won't run any
      collection until it is approved and the ethics clearance is done
      (RULES §5.10). If approved, re-fetching the 15,000 labeled ids through
      the API is a provenance and deletion check worth reporting.

  - id: guideline-prompt-test-2026-11
    section: Annotation
    title: Read the guideline-prompt test (runs by itself after v3)
    details: >
      Armed 2026-11-23: when the v3 run ends, the same three models label the 300
      gold items with the guideline as their prompt (evaluation only, on this
      laptop, ~1.5-2 h). Progress is in data/.guideline-eval.log and the result
      in data/eval-report-guideline.md. Compare the "*-guide" rows with the
      plain model rows. If agreement with you rises a lot, much of the
      human-LLM gap is the definition, not the models (a thesis result, and
      leische's U2 question).

  - id: send-v3-to-leische-2026-11
    section: Handoff to leische
    title: Send the v3 bundle to the leische machine (when you want v3 runs)
    details: >
      dataset-v3 was exported 2026-11-23 (21,000 rows, majority vote, equal-size
      models; data/annotated/uyam-dataset-v3.zip). Same transfer as v2: the
      Annotation tab's Download bundle, or `tailscale file cp
      data\annotated\uyam-dataset-v3.zip <leische-device>:`. Then
      `sha256sum -c SHA256SUMS.txt` there. Never through GitHub.

  - id: v4-guideline-pilot-go-2026-11
    section: Annotation
    title: Say go for the v4 pilot (5,000 items, guideline prompt, ~14 h laptop GPU)
    details: >
      Prepared 2026-11-23: data/db/annotation-v4.sqlite3 holds the 300 gold items
      plus 4,700 stratified v3 items; the 900 gold votes from the definition test
      are already in. The same three models label the rest with the guideline
      prompt (guide-v1.1), all on this laptop, never the gaming PC. An agent
      starts it on your go (`uyam annotate pipeline --config-path
      config/annotation-v4.yaml --skip-prep --skip-gold`), then aggregates and
      exports v4 and compares it with v3 on the same ids and against your gold.

  - id: decide-guideline-reannotation-2026-11
    section: Annotation
    title: After the adviser meeting - full guideline re-annotation or keep v3?
    details: >
      The v4 pilot (2026-11-24, 5,000 items) doubles sarcasm agreement with your
      gold labels (kappa 0.24 -> 0.48, blind 0.18 -> 0.64) but breaks the language
      label (kappa 0.08: English items called Taglish) and the models disagree
      more (Fleiss 0.40 -> 0.26; SEA-LION 41% positive). A full run needs a fixed
      prompt (guide-v1.2) or language from v3/LID, a new pilot, then ~2-3 days of
      laptop GPU. Numbers in UYAM_LATEST (top).

  - id: send-v4-smoke-to-leische-2026-11
    section: Handoff to leische
    title: Send the v4 pilot bundle to leische for a retrain smoke test
    details: >
      data/annotated/uyam-dataset-v4.zip (5,000 rows, guideline-prompt labels, with
      the new rule-based language field). Same transfer as v3; the request to the
      leische chat is in UYAM_LATEST section 9 (1 fold, a few epochs, numbers not
      reported).

  - id: approve-wordfreq-tagger-2026-11
    section: Annotation
    title: OK to install wordfreq for the Tagalog fix in the language rule?
    details: >
      The rule-based language gets English right (48/49 gold) but Tagalog only 1/11:
      fastText reads common Tagalog words as English. wordfreq (pip, ~57 MB, no
      model) has English and Filipino word-frequency lists to tag each word by
      the language that uses it more. No LLM. Say yes and an agent installs it,
      re-scores the rule against your gold once, and re-exports if it helps.

  - id: media-context-v2-to-leische-2026-11
    section: Handoff to leische
    title: Send media_context-v2.jsonl to the leische machine (small file)
    details: >
      43% of the labeled items reply to image/video posts nobody saw (UYAM_LATEST
      §9.1). data/annotated/media_context-v2.jsonl (3 MB) lets leische report
      results on the text-only slice of v2 now. Send it the same way as the
      bundle (Taildrop, or copy it), then point the leische chat at UYAM_LATEST
      §9. v3's export will carry the flag inline.

  - id: leische-adviser-items-2026-11
    section: Adviser items (meeting Wed 2026-11-25)
    title: Have a leische chat take the model-side adviser items
    details: >
      Re-run the 3 main conditions on majority-vote labels; add zero-shot LLM
      and text-concatenation baselines; run RQ3 on all folds with controls;
      re-run on items with real context only. The data for all four is in
      dataset-v2, and leische sees them in UYAM_LATEST §9–§10 at session
      start. Score the zero-shot LLM mainly against the human gold (scoring
      it against LLM labels is circular), and run it only with your OK on
      which machine.

  - id: tsis-terminology-filipino-2026-11
    section: Thesis manuscript
    title: Terminology - "Taglish" to "Filipino"; define code-switching
    details: >
      Adviser: replace "Taglish" with "Filipino" and define Filipino and
      intra-sentential code-switching. Data note for the definition: the
      label marks a target that meaningfully mixes both languages (neither
      ≥ ~90%), per target, so it covers intra- AND inter-sentential
      switching. Keep the three profiles and rename them in the text. Done in
      a tsis chat (UYAM_LATEST §10 row 11).
