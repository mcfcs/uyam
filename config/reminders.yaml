# To-dos for Gio, shown in the Streamlit "Reminders" tab.
#
# Agents: when you leave Gio a step to do (a real run, a review, thesis text),
# append it here with a new unique `id` — never reuse or rename an id, the
# done-state in data/reminders.json is keyed by it. Mirror it in HANDOFF.md.
#
# Fields: id, section, title, details (markdown), command (optional, shown as a
# copyable block), check (optional built-in detector that shows a hint — it
# never ticks the box for you):
#   db_backup | proxies_file | archive_runs | shreddit_recent | phatic_selected
#   low_conf_queue | gold_progress | export_v2

reminders:
  - id: backup-annotation-db-2026-11
    section: Before any real run
    title: Back up the annotation database
    details: >
      RULES §5.3: copy `data/db/annotation.sqlite3` before re-indexing or
      re-selecting. Close the Streamlit app or stop annotation jobs first so
      the copy is consistent.
    command: copy data\db\annotation.sqlite3 data\db\annotation-2026-11-10.bak.sqlite3
    check: db_backup

  - id: archive-backfill-jun-nov
    section: Data collection
    title: Run the archive backfill (2026-06-01 → 2026-11-10)
    details: >
      Arctic Shift archive, all three subreddits. Full window is roughly
      40–55k posts / 12–20 h; `--per-day 40` caps it at ~19k posts / 6–8 h.
      Safe to stop and re-run — dedup skips what is already stored. The
      keyword oversampling searches run afterwards automatically.
    command: uyam collect --source archive --since 2026-06-01 --until 2026-11-10 --per-day 40
    check: archive_runs

  - id: proxies-new-provider-2026-11
    section: Data collection
    title: Load the new provider's proxies (Wolves plan expired)
    details: >
      proxies.txt still held only the 5,000 wolveproxy.com proxies (unchanged
      since 2026-08-15), so Shreddit runs were going through dead proxies — the
      last real run (2026-09-05) logged 1,267 failed page loads. Proxies tab →
      paste or upload the new provider's list → "Test the new list first" →
      Replace the whole list (a backup is kept). The archive backfill does not
      need proxies.
    check: proxies_file

  - id: shreddit-latest-days-nov
    section: Data collection
    title: Fill the latest days with Shreddit (archive lags ~2 days)
    details: >
      Ran 2026-11-11 (walk only): Nov 8–10 is collected for all three
      subreddits, so tick this once you've glanced at the Detected line. Use
      the same command with a later --since for top-ups, or as a fallback if
      the archive is down. Needs Chrome + proxies.txt; solve any captcha in
      the Chrome window.
    command: uyam collect --source shreddit --since 2026-11-08 --per-day 40
    check: shreddit_recent

  - id: shreddit-keyword-searches-2026-11
    section: Data collection
    title: "Not needed any more: Shreddit keyword-oversampling searches"
    details: >
      Superseded 2026-11-19. The archive collected every post from Jun 1 to
      Nov 10, so any keyword search only re-finds posts already stored (the
      archive's own searches returned 107 hits, all duplicates). You can just
      tick this off. Oversampling is now an annotation choice; see the
      "Decide whether to annotate the 1,148 sarcasm-marker items" reminder.

  - id: retag-shreddit-trial-2026-11-10
    section: Data collection
    title: Decide what to do with the mis-tagged Shreddit trial rows
    details: >
      The stopped 2026-11-10 trial stored 57 posts (and their comments) as
      keyword_oversampled even though the browser walked /new. Six posts
      from that trial are correctly natural. Raw JSONL was not rewritten.
      A later run skips these ids as duplicates, so the wrong tag sticks
      unless you ask for a retag.

  - id: decide-marker-oversampling-2026-11
    section: Annotation
    title: Decide whether to annotate the 1,148 sarcasm-marker items
    details: >
      Collection is complete (every post Jun 1 → Nov 10), so searching Reddit
      by keyword adds nothing. Oversampling can only mean choosing extra
      annotation targets: the 1,148 unlabeled items containing a marker
      ("sana all" looks strongest: 8 of 15 labeled are sarcastic). They'd be
      tagged keyword_oversampled and kept out of natural metrics. That's about
      8% of the original annotation effort. If not, the thesis says
      oversampling wasn't needed at collection. See UYAM_LATEST.md §5.

  - id: reindex-reselect-phatic
    section: Annotation
    title: Re-index the corpus and re-run candidate selection
    details: >
      Indexes the new archive data and applies the new `phatic` filter.
      Dry run predicted 107 items excluded and 21 phatic-but-voted-sarcastic
      items sent to the review queue.
    command: uyam annotate index && uyam annotate select
    check: phatic_selected

  - id: review-phatic-low-confidence
    section: Annotation
    title: Label the low-confidence review queue
    details: >
      "Annotation Review" tab → low_confidence queue. Mostly happy-birthday
      / congrats comments one model called sarcastic — your label is final.
    check: low_conf_queue

  - id: gold-subset-300
    section: Annotation
    title: Finish the gold subset (300 items)
    details: >
      "Annotation Review" tab → gold queue, labeled blind. Needed for the
      human-vs-ensemble Cohen's κ (leische H1). Was 31 / 300 on 2026-11-10.
    check: gold_progress

  - id: export-dataset-v2
    section: Handoff to leische
    title: Aggregate and export dataset v2
    details: >
      Compare `temporal_context_coverage` and `collection_window` in the new
      dataset_card.json against v1 (35% of rows with ≥1 history post;
      2026-08-01 → 09-04).
    command: uyam annotate aggregate && uyam annotate export --version v2
    check: export_v2

  - id: send-v2-to-leische
    section: Handoff to leische
    title: Send the v2 bundle to the leische machine
    details: >
      Open this app at http://<tailscale-ip>:8501 from the leische device →
      Annotation tab → Download bundle (.zip), then
      `sha256sum -c SHA256SUMS.txt`. Tell leische the version changed.

  - id: thesis-arctic-shift-method
    section: Thesis manuscript
    title: State the Arctic Shift archive in methodology + ethics
    details: >
      Chapter III: historical posts come from a third-party Reddit archive
      (Arctic Shift); Aug–Sep core scraped live. Archive scores are
      ingest-time snapshots, so score is not compared across sources.
      Authors hashed with the same HMAC key before storage.

  - id: ethics-collection-method-2026-11
    section: Thesis manuscript
    title: Settle the data-collection ethics with your adviser
    details: >
      None of the data came through Reddit's official API: the v1 core was
      scraped (logged-out pages, rotating proxies), and v2 history comes from
      the Arctic Shift archive. Reddit's User Agreement (1 Jul 2026)
      prohibits scraping without prior written consent. The thesis should
      describe the real method, drop the "public API" reason in Scope ¶1,
      disclose proxy rotation, and state a deletion policy for archived
      content. See UYAM_LATEST.md §3.1.

  - id: thesis-window-and-phatic
    section: Thesis manuscript
    title: Update the collection window and preprocessing filters
    details: >
      Real span after the backfill (from dataset_card `collection_window`),
      and add the `phatic` exclusion (birthday / thanks / congrats-only text)
      to the preprocessing list with its count from the card.

  - id: pilot-nimble-annotator-2026-11
    section: Optional
    title: Pilot nimble (adviser's suggestion) as an evaluation-only annotator
    details: >
      nimble:9b (Bespoke Labs, fine-tuned Qwen3.5-9B, ~9.4 GB, Apache 2.0) is a
      fast classification model with no reasoning step and no stated Tagalog
      support. It won't fit the 8 GB local GPU, so run it on the 24 GB box.
      Pilot it on the gold items (once about 150 are labeled) plus a
      500-item sample, and compare its agreement with your gold labels
      against the three current annotators. Don't add it to the voting
      ensemble for v2; leische asked that the labels stay unchanged.

  - id: optional-annotate-new-items
    section: Optional
    title: Annotate new Jun–Nov items (raise the target above 12,000)
    details: >
      Only if you want more labels, not just more temporal context. Raise
      `pipeline.target_items` in config/annotation.yaml, then Start ALL.
    command: uyam annotate pipeline
