# Keep the dashboard alive while the scraper writes JSONL, logs, and screenshots.
# Watching `data/` (or __pycache__) restarts Streamlit and kills the live UI.

[server]
fileWatcherType = "none"
folderWatchBlacklist = [
    "data",
    "data/raw",
    "data/db",
    "data/manifests",
    "data/.scrape-status",
    "data/.annotate-status",
    "data/.browser-profile",
    "src/uyam/__pycache__",
    "tests/__pycache__",
    ".venv",
    "context",
    "__pycache__",
]
# The app is mostly used over Tailscale from another device: compress the
# websocket so table/log payloads are a fraction of the size.
enableWebsocketCompression = true

[browser]
gatherUsageStats = false

[runner]
# Interrupt a slow render when the user clicks something instead of queueing
# the click behind it (the default). With fastReruns off, clicks were dropped.
fastReruns = true
